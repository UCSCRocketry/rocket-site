name: ci
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    name: Site build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install Cairo for social cards
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Build site (warnings are errors)
        run: python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: site
          path: site/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/
      - name: Deploy validated site
        run: |
          python -m pip install ghp-import==2.1.0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          ghp-import --no-jekyll --push --force site
